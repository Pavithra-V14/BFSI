name: CI

# Skeleton for spec section 17.2 (tagged [P]). Phase 1 adds: lint, fast unit
# tests, secret scan and pip-audit. Phase 13 adds the 20-case evaluation as an
# alert-only job (a stubbed model: no key, no network). The deploy step arrives
# in Phase 15.
#
# Quality gates are alerts only (build rule 5): a failing job shows a red cross,
# but no branch protection rule is configured to block a merge or a release.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.8"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create the environment and install packages
        run: |
          uv venv
          uv pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    # A throw-away Postgres that exists only for this job on the CI runner. It is
    # not your machine and not your cloud database.
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create the environment and install packages
        run: |
          uv venv
          uv pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests
        run: uv run pytest

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks v8.30.1 and verify its checksum
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the repository history
        run: ./gitleaks git --redact --no-banner --verbose

  # pip-audit covers requirements.txt and requirements-dev.txt only. The ingest and
  # eval files (admin machine only) are not audited here.
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Audit runtime and development packages
        run: uvx --from pip-audit==2.10.1 pip-audit -r requirements.txt -r requirements-dev.txt

  # Deploy and the check after it (spec 17.2, Phase 15). Render deploys by itself when this
  # workflow's checks pass (`autoDeployTrigger: checksPass` in render.yaml), so NOTHING here holds
  # a Render secret and a pull request from a fork cannot reach one. This job only LOOKS: after a
  # push to main has passed the blocking jobs it asks the API's public liveness address (a
  # repository VARIABLE, not a secret) until it answers, for up to 12 minutes, and goes red when
  # it does not. It is alert only (`continue-on-error`): a red cross never blocks anything (build
  # rule 5). It cannot tell the new build from the old one (the liveness answer reveals nothing,
  # by design); it shows that the service is up after the deploy window.
  post-deploy-smoke:
    needs: [lint, test, secret-scan, pip-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Ask the liveness address until it answers
        env:
          API_URL: ${{ vars.RENDER_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "RENDER_API_URL is not set as a repository variable: nothing to check yet"
            exit 0
          fi
          for attempt in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${API_URL%/}/live" || true)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "the API did not answer /live within 12 minutes"
          exit 1

  # Coverage (spec 16, Phase 14). ALERT ONLY, like the evaluation job: `continue-on-error` means
  # a red cross never blocks a merge or a release (build rule 5). It runs the whole suite WITH the
  # throw-away Postgres container, so the Postgres tests count, and reports each package's line
  # and branch coverage. Only gateway, guardrails, cache and memory have the 80 % target; the
  # others (accounts, api, pipeline, ingest, ...) are shown for information.
  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create the environment and install packages
        run: |
          uv venv
          uv pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests with coverage
        run: uv run pytest -q --cov=app --cov-branch --cov-report=json:coverage.json
      - name: Per-package report (alert only)
        run: uv run python scripts/coverage_report.py coverage.json

  # The 20-case evaluation (spec 17.2, Phase 13). ALERT ONLY: `continue-on-error` means a red
  # cross here never blocks a merge or a release (build rule 5). It runs the active set through the
  # real pipeline over a small copy of the sample corpus with a SCRIPTED model, so it needs no key
  # and makes no network call: it proves the harness, the scenarios and the scoring still work
  # together. It does not measure the quality of a real model. A run against real providers is an
  # owner-run command (docs/OWNER_RUNS.md) and needs the owner's explicit yes; no provider key is
  # configured for CI.
  evaluation-core:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create the environment and install packages
        run: |
          uv venv
          uv pip install -r requirements.txt -r requirements-dev.txt
      - name: Core set on the stubbed model (alert only)
        run: uv run pytest tests/test_eval_runner.py -k stubbed_model -s -q
