<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1780" viewBox="0 0 1840 1780" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#455a64"/></marker></defs><rect width="1840" height="1780" fill="#ffffff"/><text x="40" y="44" font-size="26" font-weight="bold" fill="#1b1b1b" text-anchor="start">BFSI RAG Assistant — Query workflow (LangGraph)</text><text x="40" y="68" font-size="14" font-weight="normal" fill="#546e7a" text-anchor="start">Every node has a timeout and checks the 30 s budget. Each LLM or Jev decision records decider · model · key fingerprint.</text><rect x="1060" y="30" width="22" height="18" rx="4" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/><text x="1090" y="44" font-size="12.5" font-weight="normal" fill="#1b1b1b" text-anchor="start">local code, no LLM</text><rect x="1310" y="30" width="22" height="18" rx="4" fill="#efe7fb" stroke="#6a3fb5" stroke-width="2"/><text x="1340" y="44" font-size="12.5" font-weight="normal" fill="#1b1b1b" text-anchor="start">LLM / Jev</text><rect x="1560" y="30" width="22" height="18" rx="4" fill="#fff1dc" stroke="#ef6c00" stroke-width="2"/><text x="1590" y="44" font-size="12.5" font-weight="normal" fill="#1b1b1b" text-anchor="start">guardrail</text><rect x="1060" y="60" width="22" height="18" rx="4" fill="#e3f0fd" stroke="#1565c0" stroke-width="2"/><text x="1090" y="74" font-size="12.5" font-weight="normal" fill="#1b1b1b" text-anchor="start">data store</text><rect x="1310" y="60" width="22" height="18" rx="4" fill="#fde8e8" stroke="#c62828" stroke-width="2"/><text x="1340" y="74" font-size="12.5" font-weight="normal" fill="#1b1b1b" text-anchor="start">early exit</text><rect x="60" y="110" width="640" height="62" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/><text x="72" y="132" font-size="15" font-weight="bold" fill="#2e7d32" text-anchor="start">1.  Authenticate + rate limit</text><text x="72" y="152" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">JWT valid · role from token · per-user limit · daily token budget</text><rect x="60" y="200" width="640" height="62" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/><text x="72" y="222" font-size="15" font-weight="bold" fill="#2e7d32" text-anchor="start">2.  Local scan (no LLM, no network)</text><text x="72" y="242" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">max 100 tokens · greeting? · injection regex · PII masking (approved allow-list)</text><rect x="60" y="290" width="640" height="84" rx="10" fill="#efe7fb" stroke="#6a3fb5" stroke-width="2"/><text x="72" y="312" font-size="15" font-weight="bold" fill="#6a3fb5" text-anchor="start">3.  Jev triage — one call on the masked query</text><text x="72" y="332" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">domain · product_line · clause_type · needs-history · vague · injection score</text><text x="72" y="349" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">fallback: Jev → Groq 20b → Gemini → rules</text><rect x="60" y="402" width="640" height="62" rx="10" fill="#fff1dc" stroke="#ef6c00" stroke-width="2"/><text x="72" y="424" font-size="15" font-weight="bold" fill="#ef6c00" text-anchor="start">4.  Injection decision</text><text x="72" y="444" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">regex + Jev score · strong signal blocks · mixed signals ask to reword</text><rect x="60" y="492" width="640" height="62" rx="10" fill="#efe7fb" stroke="#6a3fb5" stroke-width="2"/><text x="72" y="514" font-size="15" font-weight="bold" fill="#6a3fb5" text-anchor="start">5.  Rewrite (answer tier) — only when needed</text><text x="72" y="534" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">needs history, or vague FIRST message → rewrite-then-clarify (static BFSI checklist)</text><rect x="60" y="582" width="640" height="62" rx="10" fill="#fff1dc" stroke="#ef6c00" stroke-width="2"/><text x="72" y="604" font-size="15" font-weight="bold" fill="#ef6c00" text-anchor="start">6.  Domain gate</text><text x="72" y="624" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">out-of-domain → refuse</text><rect x="60" y="672" width="640" height="62" rx="10" fill="#e3f0fd" stroke="#1565c0" stroke-width="2"/><text x="72" y="694" font-size="15" font-weight="bold" fill="#1565c0" text-anchor="start">7.  Cache lookup — exact key first</text><text x="72" y="714" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">hash(masked query + role + corpus version + prompt version) · verify cited chunks on hit</text><rect x="60" y="762" width="640" height="62" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/><text x="72" y="784" font-size="15" font-weight="bold" fill="#2e7d32" text-anchor="start">8.  Embed query</text><text x="72" y="804" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">Gemini key A → key B · both fail → temporarily unavailable</text><rect x="60" y="852" width="640" height="84" rx="10" fill="#e3f0fd" stroke="#1565c0" stroke-width="2"/><text x="72" y="874" font-size="15" font-weight="bold" fill="#1565c0" text-anchor="start">9.  Retrieve — Qdrant hybrid</text><text x="72" y="894" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">dense + sparse prefetch · RRF k=60 · 25 candidates</text><text x="72" y="911" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">hard filters: role + active · soft: product_line / clause_type (retry unfiltered)</text><rect x="60" y="964" width="640" height="62" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/><text x="72" y="986" font-size="15" font-weight="bold" fill="#2e7d32" text-anchor="start">10.  Rerank</text><text x="72" y="1006" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">Cohere → Jina → lexical · keep top 5</text><rect x="60" y="1054" width="640" height="62" rx="10" fill="#fff1dc" stroke="#ef6c00" stroke-width="2"/><text x="72" y="1076" font-size="15" font-weight="bold" fill="#ef6c00" text-anchor="start">11.  Context guard</text><text x="72" y="1096" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">relevance floor · scan chunks for instruction-like text · delimiters</text><rect x="60" y="1144" width="640" height="62" rx="10" fill="#fff1dc" stroke="#ef6c00" stroke-width="2"/><text x="72" y="1166" font-size="15" font-weight="bold" fill="#ef6c00" text-anchor="start">12.  Confidence check</text><text x="72" y="1186" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">low → show confidence, say may be incorrect, ask for a clearer query</text><rect x="60" y="1234" width="640" height="62" rx="10" fill="#efe7fb" stroke="#6a3fb5" stroke-width="2"/><text x="72" y="1256" font-size="15" font-weight="bold" fill="#6a3fb5" text-anchor="start">13.  Generate (answer tier)</text><text x="72" y="1276" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">Groq 120b → Gemini → OpenRouter · static prompt first · no history</text><rect x="60" y="1324" width="640" height="62" rx="10" fill="#fff1dc" stroke="#ef6c00" stroke-width="2"/><text x="72" y="1346" font-size="15" font-weight="bold" fill="#ef6c00" text-anchor="start">14.  Output guard</text><text x="72" y="1366" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">schema · numeric check · citation check · groundedness · conditional disclaimer</text><rect x="60" y="1414" width="640" height="62" rx="10" fill="#e3f0fd" stroke="#1565c0" stroke-width="2"/><text x="72" y="1436" font-size="15" font-weight="bold" fill="#1565c0" text-anchor="start">15.  Cache write</text><text x="72" y="1456" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">only grounded + verified + no warning + corpus version unchanged</text><rect x="60" y="1504" width="640" height="62" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/><text x="72" y="1526" font-size="15" font-weight="bold" fill="#2e7d32" text-anchor="start">16.  Persist</text><text x="72" y="1546" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">masked messages · summary buffer · session facts · trace · audit</text><rect x="60" y="1594" width="640" height="62" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/><text x="72" y="1616" font-size="15" font-weight="bold" fill="#2e7d32" text-anchor="start">17.  Respond</text><text x="72" y="1636" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">answer + citations (+ warning / confidence / degraded-mode notice)</text><line x1="380.0" y1="172" x2="380.0" y2="200" stroke="#455a64" stroke-width="2" marker-end="url(#ah)"/><line x1="380.0" y1="262" x2="380.0" y2="290" stroke="#455a64" stroke-width="2" marker-end="url(#ah)"/><line x1="380.0" y1="374" x2="380.0" y2="402" stroke="#455a64" stroke-width="2" marker-end="url(#ah)"/><line x1="380.0" y1="464" x2="380.0" y2="492" stroke="#455a64" stroke-width="2" marker-end="url(#ah)"/><line x1="380.0" y1="554" x2="380.0" y2="582" stroke="#455a64" stroke-width="2" marker-end="url(#ah)"/><line x1="380.0" y1="644" x2="380.0" y2="672" stroke="#455a64" stroke-width="2" marker-end="url(#ah)"/><line x1="380.0" y1="734" x2="380.0" y2="762" stroke="#455a64" stroke-width="2" marker-end="url(#ah)"/><line x1="380.0" y1="824" x2="380.0" y2="852" stroke="#455a64" stroke-width="2" marker-end="url(#ah)"/><line x1="380.0" y1="936" x2="380.0" y2="964" stroke="#455a64" stroke-width="2" marker-end="url(#ah)"/><line x1="380.0" y1="1026" x2="380.0" y2="1054" stroke="#455a64" stroke-width="2" marker-end="url(#ah)"/><line x1="380.0" y1="1116" x2="380.0" y2="1144" stroke="#455a64" stroke-width="2" marker-end="url(#ah)"/><line x1="380.0" y1="1206" x2="380.0" y2="1234" stroke="#455a64" stroke-width="2" marker-end="url(#ah)"/><line x1="380.0" y1="1296" x2="380.0" y2="1324" stroke="#455a64" stroke-width="2" marker-end="url(#ah)"/><line x1="380.0" y1="1386" x2="380.0" y2="1414" stroke="#455a64" stroke-width="2" marker-end="url(#ah)"/><line x1="380.0" y1="1476" x2="380.0" y2="1504" stroke="#455a64" stroke-width="2" marker-end="url(#ah)"/><line x1="380.0" y1="1566" x2="380.0" y2="1594" stroke="#455a64" stroke-width="2" marker-end="url(#ah)"/><rect x="780" y="200" width="470" height="38" rx="10" fill="#fde8e8" stroke="#c62828" stroke-width="2"/><text x="792" y="222" font-size="12.5" font-weight="bold" fill="#c62828" text-anchor="start">Too long → "please shorten" (never truncate)</text><line x1="700" y1="218" x2="780" y2="219" stroke="#c62828" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="780" y="244" width="470" height="38" rx="10" fill="#fde8e8" stroke="#c62828" stroke-width="2"/><text x="792" y="266" font-size="12.5" font-weight="bold" fill="#c62828" text-anchor="start">Pure greeting / farewell → fixed reply (no LLM, no cache)</text><line x1="700" y1="226" x2="780" y2="263" stroke="#c62828" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="780" y="402" width="470" height="38" rx="10" fill="#fde8e8" stroke="#c62828" stroke-width="2"/><text x="792" y="424" font-size="12.5" font-weight="bold" fill="#c62828" text-anchor="start">Blocked → refusal; detector logged</text><line x1="700" y1="420" x2="780" y2="421" stroke="#c62828" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="780" y="582" width="470" height="38" rx="10" fill="#fde8e8" stroke="#c62828" stroke-width="2"/><text x="792" y="604" font-size="12.5" font-weight="bold" fill="#c62828" text-anchor="start">Out-of-domain → refuse + review queue</text><line x1="700" y1="600" x2="780" y2="601" stroke="#c62828" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="780" y="672" width="470" height="38" rx="10" fill="#fde8e8" stroke="#c62828" stroke-width="2"/><text x="792" y="694" font-size="12.5" font-weight="bold" fill="#c62828" text-anchor="start">Hit verified → return cached answer</text><line x1="700" y1="690" x2="780" y2="691" stroke="#c62828" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="780" y="762" width="470" height="38" rx="10" fill="#fde8e8" stroke="#c62828" stroke-width="2"/><text x="792" y="784" font-size="12.5" font-weight="bold" fill="#c62828" text-anchor="start">Embedding keys down → "temporarily unavailable"</text><line x1="700" y1="780" x2="780" y2="781" stroke="#c62828" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="780" y="852" width="470" height="38" rx="10" fill="#fde8e8" stroke="#c62828" stroke-width="2"/><text x="792" y="874" font-size="12.5" font-weight="bold" fill="#c62828" text-anchor="start">Qdrant down → "temporarily unavailable"</text><line x1="700" y1="870" x2="780" y2="871" stroke="#c62828" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="780" y="1144" width="470" height="38" rx="10" fill="#fde8e8" stroke="#c62828" stroke-width="2"/><text x="792" y="1166" font-size="12.5" font-weight="bold" fill="#c62828" text-anchor="start">Low confidence → answer with warning + review queue</text><line x1="700" y1="1162" x2="780" y2="1163" stroke="#c62828" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="780" y="1324" width="470" height="38" rx="10" fill="#fde8e8" stroke="#c62828" stroke-width="2"/><text x="792" y="1346" font-size="12.5" font-weight="bold" fill="#c62828" text-anchor="start">Check fails → answer WITH WARNING, unverified numbers highlighted</text><line x1="700" y1="1342" x2="780" y2="1343" stroke="#c62828" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="1300" y="110" width="500" height="150" rx="10" fill="#f3f3f3" stroke="#616161" stroke-width="2"/><text x="1312" y="132" font-size="15" font-weight="bold" fill="#616161" text-anchor="start">Session handling</text><text x="1312" y="152" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">New session: no history; vague first message → clarify</text><text x="1312" y="169" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">Existing session: load summary + facts + verbatim buffer</text><text x="1312" y="186" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">(400 tok buffer + 150 tok summary — sweep 200–1200)</text><text x="1312" y="203" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">Two unclear turns in a row → fixed message + review flag</text><rect x="1300" y="280" width="500" height="150" rx="10" fill="#f3f3f3" stroke="#616161" stroke-width="2"/><text x="1312" y="302" font-size="15" font-weight="bold" fill="#616161" text-anchor="start">Cache staleness (immediate)</text><text x="1312" y="322" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">corpus_version in every key · chunk/doc reverse sets</text><text x="1312" y="339" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">edited/removed chunk → invalidate · new chunk → same doc</text><text x="1312" y="356" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">read-time hash check · skip write if corpus changed</text><text x="1312" y="373" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">TTL is only a backstop</text><rect x="1300" y="450" width="500" height="130" rx="10" fill="#f3f3f3" stroke="#616161" stroke-width="2"/><text x="1312" y="472" font-size="15" font-weight="bold" fill="#616161" text-anchor="start">Observability per request</text><text x="1312" y="492" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">Langfuse span per stage · masked input/output</text><text x="1312" y="509" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">prompt hash · chunk ids + hashes · filters · cost + shadow cost</text><text x="1312" y="526" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">correlation id recorded (not shown to users)</text><rect x="1300" y="600" width="500" height="110" rx="10" fill="#fffbe0" stroke="#9e8600" stroke-width="2"/><text x="1312" y="622" font-size="15" font-weight="bold" fill="#9e8600" text-anchor="start">Dev only (local)</text><text x="1312" y="642" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">DEV_STAGE_TRACE prints each stage live in the terminal</text><text x="1312" y="659" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">with timing + decider/model/key — off in production</text><rect x="1300" y="730" width="500" height="130" rx="10" fill="#f3f3f3" stroke="#616161" stroke-width="2"/><text x="1312" y="752" font-size="15" font-weight="bold" fill="#616161" text-anchor="start">Fallbacks everywhere</text><text x="1312" y="772" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">Jev → Groq 20b → Gemini → rules</text><text x="1312" y="789" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">answers: Groq → Gemini → OpenRouter</text><text x="1312" y="806" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">all keys of a provider limited → next provider</text><text x="1312" y="823" font-size="12.5" font-weight="normal" fill="#2b2b2b" text-anchor="start">everything down → "temporarily unavailable" + alert</text></svg>