[project]
name = "bfsi"
version = "0.1.0"
description = "BFSI RAG Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

# Tool settings only. Dependencies live in the requirements*.txt files
# (spec section 2), so uv must not lock or sync this project on its own.
[tool.uv]
managed = false

[tool.ruff]
line-length = 100
target-version = "py312"
# spec holds the sample generator; .claude holds the hook script, which is not
# part of the application and must not be reformatted by a tool.
extend-exclude = ["spec", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's way of asking for a dependency is a call in an argument default.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "postgres: needs TEST_POSTGRES_URL (CI service container); skipped when it is not set",
    "chaos: providers forced to fail on a fake clock; breakers trip and recover (spec 16)",
    "contract: structured outputs against what providers return (spec 16)",
    "recorded: replays cassettes of real provider responses; skipped until recorded (spec 16)",
]
